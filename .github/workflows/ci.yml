name: CI

# Pull-request checks. Deploys are handled separately (AWS Amplify builds on push).
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Fails on unused / unlisted dependencies. (Unused exports and files are reported by
      # `npx knip` but are not enforced yet.)
      - name: Dependency hygiene
        run: pnpm check:deps

      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

      # Reports lint problems without blocking: one known error remains in
      # features/reviews/components/ListReviewPage.tsx. Remove `continue-on-error`
      # once it is fixed.
      - name: Lint
        run: pnpm lint --quiet
        continue-on-error: true

      # No backend is needed: guest pages are rendered on demand and the build tolerates an
      # unreachable API (sitemap falls back to an empty list).
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_BASE_URL: https://ci.example.com
          API_PROXY_TARGET: http://127.0.0.1:1
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:1/api

      # Guest-facing pages must stay light on mobile. Raise a budget in the same PR if it is intentional.
      - name: Bundle budget (public pages)
        run: pnpm check:bundle
